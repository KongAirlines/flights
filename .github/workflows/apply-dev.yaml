name: Sync development desired state

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dev.yaml
      - gateway/dev/kong.yaml
      - konnect/dev.yaml
      - konnect/dev-versions.yaml
      - openapi.yaml
      - scripts/generate-gateway.sh

permissions:
  contents: read

concurrency:
  group: flights-development
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
      - name: Install decK
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Verify committed Gateway state matches the API contract
        run: |
          ./scripts/generate-gateway.sh
          git diff --exit-code -- gateway/dev/kong.yaml gateway/prod/kong.yaml
      - name: Add development API version
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          # Restore --require-namespace flights after kongctl #2503 is released.
          kongctl apply -f konnect/dev-versions.yaml --base-dir . \
            --auto-approve
      - name: Transition ACE-governed API version
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        # Temporary sequencing workaround for https://github.com/Kong/kongctl/issues/2510.
        # Remove this step after declarative sync supports forced ACE version transitions.
        run: ./scripts/transition-ace-api-version.sh "KongAir Flights - Development"
      - name: Sync development Catalog and Gateway state
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: kongctl sync -f konnect/dev.yaml --base-dir . --auto-approve --require-namespace flights
