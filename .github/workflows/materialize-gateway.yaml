name: Materialize validated Gateway state

on:
  workflow_run:
    workflows:
      - Validate Konnect desired state
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: materialize-gateway-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Find validated Gateway artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "gateway-state") | .id')"
          if [[ -z "${artifact_id}" ]]; then
            echo "No validated Gateway artifact was produced; nothing to materialize."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "found=true" >> "${GITHUB_OUTPUT}"
      - name: Confirm source is the current same-repository PR head
        if: steps.artifact.outputs.found == 'true'
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          head_repository="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')"
          if [[ "${head_repository}" != "${GITHUB_REPOSITORY}" || "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "The PR head moved or belongs to a fork; a newer run will materialize it."
            echo "current=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "current=true" >> "${GITHUB_OUTPUT}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"base_sha=" + .base.sha' >> "${GITHUB_OUTPUT}"
      - name: Download validated Gateway state
        if: steps.source.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-state
          path: ${{ runner.temp }}/gateway-state
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install decK
        if: steps.source.outputs.current == 'true'
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Validate artifact boundaries
        if: steps.source.outputs.current == 'true'
        env:
          MATERIALIZED: ${{ runner.temp }}/gateway-state
        run: |
          test -f "${MATERIALIZED}/dev/kong.yaml"
          test -f "${MATERIALIZED}/prod/kong.yaml"
          test ! -L "${MATERIALIZED}/dev/kong.yaml"
          test ! -L "${MATERIALIZED}/prod/kong.yaml"
          test "$(find "${MATERIALIZED}" -type f | wc -l)" -eq 2
          deck file validate "${MATERIALIZED}/dev/kong.yaml"
          deck file validate "${MATERIALIZED}/prod/kong.yaml"
      - name: Generate service automation token
        if: steps.source.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REFERENCE_PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFERENCE_PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out current PR branch
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Commit materialized Gateway state
        if: steps.source.outputs.current == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MATERIALIZED: ${{ runner.temp }}/gateway-state
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          install -m 0644 "${MATERIALIZED}/dev/kong.yaml" gateway/dev/kong.yaml
          install -m 0644 "${MATERIALIZED}/prod/kong.yaml" gateway/prod/kong.yaml
          if git diff --quiet -- gateway/dev/kong.yaml gateway/prod/kong.yaml; then
            echo "Committed Gateway state already matches the validated artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/dev/kong.yaml gateway/prod/kong.yaml
          git commit -m "chore: materialize Gateway state"
          git push origin HEAD
      - name: Publish desired-state review
        if: steps.source.outputs.current == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SUMMARY_FILE: ${{ runner.temp }}/desired-state-review.md
        run: |
          marker='<!-- reference-platform-desired-state-review -->'
          current_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          {
            echo "${marker}"
            echo '## Desired-state review'
            echo
            echo "Generated Gateway state at \`${short_sha}\` has been validated and is committed to this PR."
            echo
            echo '### Changed API platform inputs'
            echo
            echo '```text'
            git diff --name-status "${BASE_SHA}...${current_sha}" -- \
              openapi.yaml openapi/ konnect/ scripts/ .github/workflows/
            echo '```'
            echo
            echo '### Generated Gateway changes'
            echo
            for environment in dev prod; do
              diff_file="${RUNNER_TEMP}/${environment}-gateway.diff"
              git diff --no-ext-diff --unified=3 "${BASE_SHA}...${current_sha}" -- \
                "gateway/${environment}/kong.yaml" > "${diff_file}"
              echo "<details><summary>${environment} Gateway diff</summary>"
              echo
              echo '```diff'
              if [[ -s "${diff_file}" ]]; then
                head -c 20000 "${diff_file}"
                echo
                if [[ "$(wc -c < "${diff_file}")" -gt 20000 ]]; then
                  echo '... diff truncated after 20 KB; review Files changed for the complete artifact.'
                fi
              else
                echo '# No generated Gateway changes.'
              fi
              echo '```'
              echo
              echo '</details>'
              echo
            done
            echo "> This is the offline, reviewable desired-state diff. The credentialed post-merge workflow produces the live \`kongctl sync\` plan against Konnect."
            echo
            echo "[Validation run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }})"
          } > "${SUMMARY_FILE}"

          cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          jq -n --rawfile body "${SUMMARY_FILE}" '{body: $body}' > "${RUNNER_TEMP}/comment.json"
          comment_id="$(GH_TOKEN="${APP_TOKEN}" gh api \
            --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- reference-platform-desired-state-review -->"))) | .id' \
            | head -n 1)"
          if [[ -n "${comment_id}" ]]; then
            GH_TOKEN="${APP_TOKEN}" gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "${RUNNER_TEMP}/comment.json"
          else
            GH_TOKEN="${APP_TOKEN}" gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "${RUNNER_TEMP}/comment.json"
          fi
