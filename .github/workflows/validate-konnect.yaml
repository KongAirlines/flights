name: Validate Konnect desired state

on:
  pull_request:
    paths:
      - .github/workflows/**
      - gateway/**
      - konnect/**
      - lint/**
      - openapi.yaml
      - openapi/**
      - scripts/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1; latest stable
      - name: Install decK
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Test native lint policies
        run: |
          python3 scripts/test-lint-policies.py
          python3 scripts/test-release-consistency.py
      - name: Generate ephemeral Gateway state
        run: ./scripts/generate-gateway.sh
      - name: Lint manifests and validate release history
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/lint-reference-platform.sh
      - name: Validate Gateway state
        run: |
          deck file validate gateway/dev/kong.yaml
          deck file validate gateway/prod/kong.yaml
      - name: Upload validated Gateway state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-state
          path: |
            gateway/dev/kong.yaml
            gateway/prod/kong.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Verify generated Gateway state is committed
        run: git diff --exit-code -- gateway/dev/kong.yaml gateway/prod/kong.yaml
