name: Promote production Gateway candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gateway/prod/kong.yaml
      - konnect/prod.yaml
      - openapi/versions/**
      - scripts/generate-gateway.sh

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out service repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: service
      - name: Generate platform automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REFERENCE_PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFERENCE_PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: write
          permission-pull-requests: write
      - name: Check out platform repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KongAirlines/platform
          token: ${{ steps.app-token.outputs.token }}
          path: platform
      - name: Install latest stable kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
      - name: Copy reviewed candidate and record provenance
        working-directory: platform
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cp ../service/gateway/prod/kong.yaml gateway/prod/flights.yaml
          CHECKSUM="$(sha256sum gateway/prod/flights.yaml | cut -d ' ' -f1)"
          KONGCTL_VERSION="$(kongctl version --output json | jq -r '.version')"
          printf '%s\n' \
            "source_repository: ${SOURCE_REPOSITORY}" \
            "source_commit: ${SOURCE_COMMIT}" \
            "sha256: ${CHECKSUM}" \
            'deck_version: 1.65.2' \
            "kongctl_version: ${KONGCTL_VERSION}" \
            > gateway/prod/flights.provenance.yaml
      - name: Open platform review
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          path: platform
          token: ${{ steps.app-token.outputs.token }}
          branch: promote/flights
          delete-branch: true
          commit-message: "gateway: promote Flights candidate"
          title: "feat(gateway): promote Flights production candidate"
          body: |
            Promotes the exact Flights Gateway artifact from
            `${{ github.repository }}@${{ github.sha }}`.

            Review and merge this PR before manually applying the production
            Catalog manifest from the same source commit.
          add-paths: |
            gateway/prod/flights.yaml
            gateway/prod/flights.provenance.yaml
